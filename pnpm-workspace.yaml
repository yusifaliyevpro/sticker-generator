saveExact: true
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: "no-downgrade"
trustPolicyExcludePrune: true
allowBuilds:
  canvas: true
# Vercel's type-check doesn't follow pnpm symlinks, so type packages must sit at the node_modules root
publicHoistPattern:
  - "@types/*"
  - undici-types
